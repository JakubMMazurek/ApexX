                        <h2 id="context-heading">A stable platform language can still make ordinary design expensive.</h2>
                        <p>Apex is dependable, but common abstractions still cost teams loops, overload ladders, mode flags, and repeated error wrappers. That friction shapes architecture long before it becomes a line-count problem.</p>
                    </div>

                    <div class="thesisCard">
                        <span class="thesisMark">AX</span>
                        <div>
                            <p class="sectionEyebrow">The project</p>
                            <h2>ApexX is an Apex-compatible source language with opt-in, typed extensions.</h2>
                            <p>Think TypeScript and JavaScript: developers work in the richer source language; the compiler emits the platform language. Generated Apex is a trustworthy build artifact—not the code humans are expected to author.</p>
                        </div>
                    </div>

                    <div class="contextGrid">
                        <article>
                            <span>01</span>
                            <strong>Compatibility first</strong>
                            <p>Every valid Apex file is valid ApexX. A team can adopt one file, one method, or one feature without rewriting its codebase.</p>
                        </article>
                        <article>
                            <span>02</span>
                            <strong>Missing primitives</strong>
                            <p>Typed collection operations, functions as values, tuples, default arguments, and custom decorators make intent directly expressible.</p>
                        </article>
                        <article>
                            <span>03</span>
                            <strong>Native deployment</strong>
                            <p>The compiler lowers extensions to ordinary <code>.cls</code> and metadata, so Salesforce needs no new runtime or awareness of ApexX.</p>
                        </article>
                    </div>

                    <div class="designPromise">
                        <strong>Adoption model</strong>
                        <code>.clsx = Apex + only the features you choose</code>
                        <span>Keep governor-sensitive loops where they belong. Reach for higher-level language tools where they make the design clearer.</span>

                        <div class="editorGrid">
                            <article><span>01</span><strong>Syntax coloring</strong><p>Apex plus dedicated scopes for lambdas, <code>Func</code>, collection helpers, defaults, and decorators.</p></article>
                            <article><span>02</span><strong>Context IntelliSense</strong><p>Completion follows element types and Salesforce schema across <code>filter</code>, <code>map</code>, and <code>flatMap</code>.</p></article>
                            <article><span>03</span><strong>Live diagnostics</strong><p>Parser, type, and lowering errors appear in the editor from the same compiler used by the build.</p></article>
                            <article><span>04</span><strong>Hover + snippets</strong><p>Feature contracts are one hover away, with templates for functions, pipelines, defaults, and decorators.</p></article>
                            <article><span>05</span><strong>Compile on save</strong><p>Saving a <code>.clsx</code> file writes the deployable class and metadata and reports the result in VS Code.</p></article>
                        </div>
                        <ol class="ideDemoPlan">
                            <li><span>1</span><div><strong>Open <code>AccountService.clsx</code></strong><p>Establish the authored source as the object developers own.</p></div></li>
                            <li><span>2</span><div><strong>Extend a typed chain</strong><p>Type after a dot and let completion prove the inferred element and sObject shape.</p></div></li>
                            <li><span>3</span><div><strong>Break, inspect, save</strong><p>Trigger a diagnostic, fix it, hover a feature, then compile the native Salesforce artifact.</p></div></li>
                        </ol>
                    </section>
                    <section class="shippingModel" aria-labelledby="shipping-model-heading">
                        <div class="internalHeading">
                            <p class="sectionEyebrow">Compilation model</p>
                            <h3 id="shipping-model-heading">What actually ships to Salesforce</h3>
                            <p>ApexX is a build-time language layer. Salesforce receives ordinary metadata and stays unaware of the source syntax.</p>
                        </div>
                        <div class="shipFlow">
                            <article><span>1</span><strong>.clsx source</strong><p>Apex plus typed language extensions.</p></article>
                            <b>→</b>
                            <article><span>2</span><strong>Parse + type + lower</strong><p>Helpers, Func values, defaults, and decorators are resolved at build time.</p></article>
                            <b>→</b>
                            <article><span>3</span><strong>Validate native Apex</strong><p>Generated source is checked through the upstream Apex parser.</p></article>
                            <b>→</b>
                            <article><span>4</span><strong>.cls + metadata</strong><p>Normal Salesforce source format, deployable with standard tooling.</p></article>
                        </div>
                        <div class="runtimeFacts">
                            <div><strong>Compatibility contract</strong><span>Every valid Apex file remains valid ApexX; adoption is feature by feature.</span></div>
                            <div><strong>Collection helpers + defaults</strong><span>Compile away completely; no runtime library.</span></div>
                            <div><strong>Structural types</strong><span>Func interfaces and tuple carriers collect into two deterministic shared registry files.</span></div>
                            <div><strong>Decorators</strong><span>Use the small opt-in Invocation / Next / Decorator support contract.</span></div>
                            <div><strong>Editor model</strong><span>Completion follows types across filter, map, and flatMap chains.</span></div>
                        </div>
                    </section>
                    <aside class="buildArtifactCallout">
                        <strong>The authored <code>.clsx</code> file is the source of truth.</strong>
                        <span>Generated Apex remains readable enough to inspect, debug, test, and trust—but, exactly like transpiled JavaScript, it is not where the design is expressed.</span>
                    </aside>
                </section>

                        <p>The comparison is realistic authored Apex versus complete authored ApexX for the same application behavior. Shared DTOs, queries, and error utilities are excluded from both sides; the ApexX rule provider and mapping helper are included. Generated Apex is not part of the source comparison for the same reason a TypeScript demo does not judge emitted JavaScript as hand-written source.</p>
