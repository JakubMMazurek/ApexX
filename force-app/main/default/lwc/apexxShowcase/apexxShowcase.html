<template>
    <lightning-card title="ApexX Showcase" icon-name="custom:custom63">
        <div class="toolbar">
            <div>
                <p class="eyebrow">Live org data</p>
                <h1>Focused ApexX methods powering one tab</h1>
            </div>
            <div class="actions">
                <lightning-button
                    label="Trigger handled error"
                    variant="neutral"
                    onclick={triggerError}
                    disabled={triggeringError}
                ></lightning-button>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh"
                    title="Refresh"
                    onclick={refresh}
                    disabled={loading}
                ></lightning-button-icon>
            </div>
        </div>

        <template lwc:if={loading}>
            <div class="state">
                <lightning-spinner alternative-text="Loading ApexX showcase"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={errorMessage}>
            <div class="state error">
                <lightning-icon icon-name="utility:error" size="small"></lightning-icon>
                <p>{errorMessage}</p>
            </div>
        </template>

        <template lwc:else>
            <section class="metrics">
                <template for:each={metrics} for:item="metric">
                    <article class="metric" key={metric.label}>
                        <span>{metric.label}</span>
                        <strong>{metric.value}</strong>
                    </article>
                </template>
            </section>

            <section class="grid">
                <article>
                    <div class="sectionHeader">
                        <h2>Priority accounts</h2>
                        <span>{priorityCount}</span>
                    </div>
                    <p class="method">loadPriorityAccounts -> computed filter + decorator</p>
                    <template lwc:if={hasPriorityAccounts}>
                        <ul class="rows">
                            <template for:each={priorityAccounts} for:item="account">
                                <li key={account.Id}>
                                    <a href={account.url}>{account.Name}</a>
                                    <span>{account.AccountNumber}</span>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <p class="empty">No priority demo accounts matched the computed rule.</p>
                    </template>
                </article>

                <article>
                    <div class="sectionHeader">
                        <h2>Normalized contact emails</h2>
                        <span>{emailCount}</span>
                    </div>
                    <p class="method">loadNormalizedContactEmails -> flatMap + filter + map</p>
                    <template lwc:if={hasEmails}>
                        <ul class="rows">
                            <template for:each={emails} for:item="email">
                                <li key={email}>
                                    <span>{email}</span>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <p class="empty">No contact emails matched the hot-account chain.</p>
                    </template>
                </article>
            </section>

            <section class="workPanel">
                <div class="sectionHeader">
                    <h2>Renewal work queue</h2>
                    <span>{renewalWorkCount}</span>
                </div>
                <p class="method">loadRenewalWork -> selected Func + workflow method + block map</p>
                <template lwc:if={hasRenewalWork}>
                    <ul class="workItems">
                        <template for:each={renewalWork} for:item="item">
                            <li key={item.accountId}>
                                <a href={item.url}>{item.accountName}</a>
                                <strong>{item.priority}</strong>
                                <span>{item.reason}</span>
                            </li>
                        </template>
                    </ul>
                </template>
                <template lwc:else>
                    <p class="empty">No renewal work generated.</p>
                </template>
            </section>

            <section class="summary">
                <p class="method">loadAccountSummary -> reused Func + count + all + find + map</p>
                <p>
                    <strong>First hot account:</strong>
                    <span>{firstHotName}</span>
                </p>
                <p>
                    <strong>All demo accounts have numbers:</strong>
                    <span>{allHaveNumbersLabel}</span>
                </p>
                <p>
                    <strong>First two revenue values within tolerance:</strong>
                    <span>{revenueWithinToleranceLabel}</span>
                </p>
                <p class="method">loadRevenueComparison -> default arg + plain comparison</p>
            </section>

            <section class="savePanel">
                <div class="sectionHeader">
                    <h2>Save account</h2>
                    <span>edit</span>
                </div>
                <p class="method">save -> decorator + default error message + validation trim</p>
                <template lwc:if={hasEditableAccounts}>
                    <div class="saveForm">
                        <lightning-combobox
                            label="Account"
                            value={selectedAccountId}
                            options={accountOptions}
                            onchange={handleSelectedAccountChange}
                        ></lightning-combobox>
                        <lightning-input
                            label="Name"
                            value={editedAccountName}
                            onchange={handleAccountNameChange}
                        ></lightning-input>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            onclick={saveDemoAccount}
                            disabled={saveDisabled}
                        ></lightning-button>
                    </div>
                </template>
                <template lwc:else>
                    <p class="empty">No priority accounts are available to edit.</p>
                </template>
                <template lwc:if={lastSavedAccountName}>
                    <p class="saveResult">
                        <strong>Last saved account:</strong>
                        <span>{lastSavedAccountName}</span>
                    </p>
                </template>
            </section>

            <section class="errorDemo">
                <div>
                    <h2>Decorated error boundary</h2>
                    <p class="method">triggerUserFriendlyError -> decorator returns the default friendly message</p>
                </div>
                <template lwc:if={handledErrorMessage}>
                    <p class="handledError">{handledErrorMessage}</p>
                </template>
            </section>
        </template>
    </lightning-card>
</template>
